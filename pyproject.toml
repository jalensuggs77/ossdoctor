[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ossdoctor"
description = "Check an open source repository for the files and automation maintainers rely on, and generate what is missing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "jalensuggs77", email = "aufirst77@gmail.com" }]
keywords = ["open source", "maintainers", "repository", "linter", "community health", "github"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jalensuggs77/ossdoctor"
Issues = "https://github.com/jalensuggs77/ossdoctor/issues"
Changelog = "https://github.com/jalensuggs77/ossdoctor/blob/main/CHANGELOG.md"

[project.scripts]
ossdoctor = "ossdoctor.cli:main"

[tool.hatch.version]
path = "src/ossdoctor/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ossdoctor]
fail-under = 100
