name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Badges in the READMEs show the current score
        run: |
          ossdoctor badge --update README.md --check
          ossdoctor badge --update README.zh-CN.md --check
      - run: ruff check .
      - run: ruff format --check .
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint workflows, including the ones ossdoctor generates
        run: |
          actionlint
          python -m pytest tests/test_ci.py -k actionlint -v

  self-check:
    name: ossdoctor on itself
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          fail-under: "100"
          sarif-file: ossdoctor.sarif
      - uses: github/codeql-action/upload-sarif@v4
        # Forks' pull requests get a read-only token and cannot upload.
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: ossdoctor.sarif
          category: ossdoctor
